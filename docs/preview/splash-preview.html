<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Splash Preview — Hello, Daryl</title>
    <style>
      /* ---------------------------------------------------------------
       * Design tokens (copied from src/styles/tokens.css)
       * ------------------------------------------------------------- */
      :root {
        --color-neutral-0: #ffffff;
        --color-neutral-50: #f7f8fa;
        --color-neutral-100: #eceef2;
        --color-neutral-200: #d5d9e0;
        --color-neutral-300: #b0b7c3;
        --color-neutral-500: #6b7280;
        --color-neutral-700: #374151;
        --color-neutral-900: #111827;

        --color-accent-100: #dbeafe;
        --color-accent-300: #93c5fd;
        --color-accent-500: #3b82f6;
        --color-accent-700: #1d4ed8;

        --font-size-sm: 0.8rem;
        --font-size-base: 1rem;
        --font-size-lg: 1.25rem;
        --font-size-xl: 1.563rem;
        --font-size-2xl: 1.953rem;
        --font-size-3xl: 2.441rem;
        --line-height-tight: 1.2;
        --line-height-normal: 1.5;

        --space-1: 0.25rem;
        --space-2: 0.5rem;
        --space-3: 0.75rem;
        --space-4: 1rem;
        --space-6: 1.5rem;
        --space-8: 2rem;
        --space-12: 3rem;

        --radius-sm: 4px;
        --radius-md: 8px;
        --radius-lg: 16px;

        --duration-fast: 120ms;
        --duration-base: 200ms;
        --ease-standard: cubic-bezier(0.4, 0, 0.2, 1);
        --ease-emphasized: cubic-bezier(0.2, 0, 0, 1);

        --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        --font-mono: "SFMono-Regular", ui-monospace, Menlo, Consolas, "Liberation Mono", monospace;

        /* Semantic aliases (light defaults) */
        --surface: var(--color-neutral-50);
        --surface-raised: var(--color-neutral-0);
        --text: var(--color-neutral-900);
        --text-muted: var(--color-neutral-500);
        --border: var(--color-neutral-200);
        --accent: var(--color-accent-500);
        --accent-contrast: var(--color-neutral-0);
        --shadow-sm: 0 1px 2px rgba(17, 24, 39, 0.08);
        --shadow-md: 0 4px 12px rgba(17, 24, 39, 0.12);
      }

      [data-theme="dark"] {
        --surface: var(--color-neutral-900);
        --surface-raised: var(--color-neutral-700);
        --text: var(--color-neutral-50);
        --text-muted: var(--color-neutral-300);
        --border: var(--color-neutral-700);
        --accent: var(--color-accent-300);
        --accent-contrast: var(--color-neutral-900);
        --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4);
        --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.5);
      }

      /* ---------------------------------------------------------------
       * Minimal reset
       * ------------------------------------------------------------- */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
      }

      body {
        min-height: 100vh;
        font-family: var(--font-sans);
        color: var(--text);
        background-color: var(--surface);
      }

      /* ---------------------------------------------------------------
       * Splash styles (from src/components/Splash.css), frozen at their
       * final / resting visible state so a single screenshot captures the
       * finished composition.
       * ------------------------------------------------------------- */
      .splash {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: var(--space-6);
        background-color: var(--surface);
        opacity: 1;
      }

      .splash__panel {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: var(--space-6);
        padding: var(--space-12) var(--space-8);
        border-radius: var(--radius-lg);
        background-color: var(--surface-raised);
        box-shadow: var(--shadow-md);
        overflow: hidden;
      }

      .splash__glow {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background:
          radial-gradient(
            circle at 50% 40%,
            var(--color-accent-300),
            var(--color-accent-100),
            transparent 70%
          );
        opacity: 0.55;
      }

      .splash__title {
        position: relative;
        margin: 0;
        font-family: var(--font-sans);
        font-size: var(--font-size-3xl);
        font-weight: 700;
        line-height: var(--line-height-tight);
        letter-spacing: -0.02em;
        color: var(--text);
        text-align: center;
      }

      .splash__letter {
        display: inline-block;
        white-space: pre;
        opacity: 1;
      }

      .splash__skip {
        position: relative;
      }

      /* Skip button (mirrors Button.tsx btn / btn--ghost / btn--sm) */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: var(--space-2);
        border: 1px solid transparent;
        border-radius: var(--radius-md);
        font-family: var(--font-sans);
        font-weight: 600;
        line-height: var(--line-height-tight);
        cursor: pointer;
      }

      .btn--ghost {
        background-color: transparent;
        color: var(--accent);
        border-color: transparent;
      }

      .btn--sm {
        font-size: var(--font-size-sm);
        padding: var(--space-1) var(--space-3);
      }
    </style>
  </head>
  <body>
    <div class="splash" role="dialog" aria-modal="true" aria-label="Welcome">
      <div class="splash__panel">
        <span class="splash__glow" aria-hidden="true"></span>
        <h1 class="splash__title" aria-label="Hello, Daryl" id="title"></h1>
        <span class="splash__skip">
          <button type="button" class="btn btn--ghost btn--sm">Skip</button>
        </span>
      </div>
    </div>
    <script>
      // Theme: honor a hardcoded data-theme on <html>, else read ?theme=dark.
      (function () {
        var params = new URLSearchParams(window.location.search)
        var themeParam = params.get('theme')
        if (themeParam === 'dark' || themeParam === 'light') {
          document.documentElement.dataset.theme = themeParam
        }
      })();

      // Build the per-letter wordmark exactly like Splash.tsx does.
      (function () {
        var title = 'Hello, Daryl'
        var host = document.getElementById('title')
        title.split('').forEach(function (char) {
          var span = document.createElement('span')
          span.className = 'splash__letter'
          span.setAttribute('aria-hidden', 'true')
          span.textContent = char
          host.appendChild(span)
        })
      })();
    </script>
  </body>
</html>
